<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Folia — 显示环境检查</title>
  <style>
    body { margin: 0; background: #09090b; color: #f4f4f5; font: 20px/1.6 sans-serif; }
    main { max-width: 900px; padding: 48px; margin: auto; }
    h1 { font-size: 32px; } p { color: #d4d4d8; } #version { word-break: break-all; font-size: 14px; }
  </style>
</head>
<body><main>
  <h1>Folia 暂时无法显示原版界面</h1>
  <p>此测试版需要 Android System WebView 111 或更高版本。若当前版本较旧，请通过车机支持的系统更新方式更新；也可以把本页拍照，供后续兼容性适配使用。</p>
  <p>如果版本已满足要求，请重新启动应用，并记录此页面以便排查资源加载问题。</p>
  <p id="version"></p>
</main><script>document.getElementById('version').textContent = navigator.userAgent;</script></body>
</html>
