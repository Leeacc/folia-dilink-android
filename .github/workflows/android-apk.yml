name: Build DiLink test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      FOLIA_ANDROID_VERSION_CODE: ${{ github.run_number }}
      VITE_NETEASE_API_BASE: ${{ vars.VITE_NETEASE_API_BASE }}
      VITE_KUGOU_API_BASE: ${{ vars.VITE_KUGOU_API_BASE }}
      VITE_FOLIA_API_BASE: ${{ vars.VITE_FOLIA_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install required SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'platform-tools'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Test Android runtime and API routing
        run: npm run test:unit -- test/unit/platform/runtime.test.ts test/unit/services/webApi.test.ts test/unit/services/loginTimeout.test.ts
      - name: Build and sync original Folia UI
        run: npm run cap:sync:android
      - name: Verify compiled UI on Chromium 95
        run: |
          npm install --prefix "$RUNNER_TEMP/legacy-pw" --ignore-scripts --no-audit --no-fund playwright@1.15.2
          curl -fL --retry 3 https://cdn.playwright.dev/dbazure/download/playwright/builds/chromium/918973/chromium-linux.zip -o "$RUNNER_TEMP/chromium95.zip"
          unzip -q "$RUNNER_TEMP/chromium95.zip" -d "$RUNNER_TEMP/chromium95"
          npm run preview -- --host 127.0.0.1 > "$RUNNER_TEMP/preview.log" 2>&1 &
          sleep 3
          FOLIA_LEGACY_PLAYWRIGHT="$RUNNER_TEMP/legacy-pw/node_modules/playwright" FOLIA_CHROMIUM_EXECUTABLE="$RUNNER_TEMP/chromium95/chrome-linux/chrome" node ci/check-chromium95.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chromium95-ui-check
          path: artifacts/chromium95/
          if-no-files-found: ignore
      - name: Assemble debug APK
        working-directory: android
        run: bash gradlew --no-daemon assembleDebug
      - name: Verify and collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/folia-dilink-test.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose artifacts/folia-dilink-test.apk > artifacts/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/folia-dilink-test.apk > artifacts/apk-info.txt
          grep -F "name='io.github.leeacc.folia.dilink'" artifacts/apk-info.txt
          grep -F "sdkVersion:'24'" artifacts/apk-info.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump xmltree artifacts/folia-dilink-test.apk AndroidManifest.xml > artifacts/manifest.txt
          grep -F 'android:screenOrientation' artifacts/manifest.txt | grep -F '0x0'
          unzip -l artifacts/folia-dilink-test.apk | grep 'assets/public/index.html'
          cp UPSTREAM.json artifacts/
          printf '%s\n' "$GITHUB_SHA" > artifacts/BUILD_COMMIT.txt
          (cd artifacts && sha256sum folia-dilink-test.apk > SHA256SUMS.txt)
          cat artifacts/apk-info.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: folia-dilink-test-apk
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 31, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: folia-dilink-test-apk
          path: artifacts
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and inspect landscape UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save
          script: bash ci/smoke-android.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}-smoke-test
          path: |
            artifacts/*.txt
            artifacts/*.png
            artifacts/*.json
          retention-days: 30
