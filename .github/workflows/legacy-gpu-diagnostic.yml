name: Diagnose legacy WebGL driver
on:
  push:
    branches: ["migration/**"]
    paths: [".github/workflows/legacy-gpu-diagnostic.yml", "ci/check-nebbia.cjs"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: FOLIA_UI_PROBES=1 npm run build:capacitor -- --outDir probe-dist
      - name: Install software OpenGL and old browser
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
          npm install --prefix "$RUNNER_TEMP/legacy-pw" --ignore-scripts --no-audit --no-fund playwright@1.15.2
          curl -fL --retry 3 https://cdn.playwright.dev/dbazure/download/playwright/builds/chromium/918973/chromium-linux.zip -o "$RUNNER_TEMP/chromium95.zip"
          unzip -q "$RUNNER_TEMP/chromium95.zip" -d "$RUNNER_TEMP/chromium95"
      - name: Verify actual Chromium95 with Mesa
        run: |
          npm run preview -- --host 127.0.0.1 --port 4191 --outDir probe-dist > "$RUNNER_TEMP/probes.log" 2>&1 &
          sleep 3
          FOLIA_GPU_BACKEND=mesa FOLIA_LEGACY_PLAYWRIGHT="$RUNNER_TEMP/legacy-pw/node_modules/playwright" FOLIA_CHROMIUM_EXECUTABLE="$RUNNER_TEMP/chromium95/chrome-linux/chrome" xvfb-run -a node ci/check-nebbia.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-gpu-diagnostic
          path: artifacts/gpu-diagnostic/
          if-no-files-found: ignore
